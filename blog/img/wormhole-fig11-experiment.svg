<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" font-family="Inter, system-ui, sans-serif">
<title>Healthy cells' acid tolerance decides the outcome</title><desc>Final tumor size after 200 steps on a 40 by 40 grid, mean of 3 runs: about 5 cells when healthy cells tolerate acid as well as tumor cells (3), about 140 at tolerance 2, and about 1,100 (every healthy cell dead) at tolerance 1.</desc>
<rect width="900" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="30" y="36" fill="#1b1c29" font-size="16" font-weight="600">Tumor size after 200 steps (40 × 40 grid, average of 3 runs)</text>
<text x="218" y="102" fill="#1b1c29" font-size="15" text-anchor="end">healthy tolerance 3</text>
<rect x="230" y="80" width="3" height="34" rx="4" fill="#d9622b"/>
<line x1="231.2" y1="97" x2="231.8" y2="97" stroke="#1b1c29" stroke-width="1.5"/>
<text x="244.4" y="95" fill="#1b1c29" font-size="15">5 tumor cells</text>
<text x="244.4" y="113" fill="#62667f" font-size="13">as acid-tough as tumor cells; ~1,546 healthy left</text>
<text x="218" y="174" fill="#1b1c29" font-size="15" text-anchor="end">healthy tolerance 2</text>
<rect x="230" y="152" width="41.4" height="34" rx="4" fill="#d9622b"/>
<line x1="240.8" y1="169" x2="302.0" y2="169" stroke="#1b1c29" stroke-width="1.5"/>
<text x="314.0" y="167" fill="#1b1c29" font-size="15">138 tumor cells</text>
<text x="314.0" y="185" fill="#62667f" font-size="13">about 1,400 healthy left</text>
<text x="218" y="246" fill="#1b1c29" font-size="15" text-anchor="end">healthy tolerance 1</text>
<rect x="230" y="224" width="336.3" height="34" rx="4" fill="#d9622b"/>
<line x1="522.5" y1="241" x2="610.0999999999999" y2="241" stroke="#1b1c29" stroke-width="1.5"/>
<text x="622.0999999999999" y="239" fill="#1b1c29" font-size="15">1,121 tumor cells</text>
<text x="622.0999999999999" y="257" fill="#62667f" font-size="13">0 healthy left</text>
<text x="30" y="310" fill="#62667f" font-size="13">Budget model, blood glucose 5. Lines show the spread between runs.</text>
</svg>