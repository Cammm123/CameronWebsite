<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" font-family="Inter, system-ui, sans-serif">
<title>One step of the simulation</title><desc>Ten times: capillaries refill oxygen and glucose and wash away lactate; every cell eats, solving its flux balance analysis; chemicals spread with the kernel. Then every cell's fate is decided at once: die from too little ATP or too much acid, divide into an empty neighbor, or stay. Deaths happen before divisions; contests for an empty square are a weighted dice roll.</desc>
<rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="30" y="40" width="520" height="200" rx="14" fill="none" stroke="#62667f" stroke-dasharray="6 5"/>
<text x="48" y="66" fill="#62667f" font-size="14">repeat 10 times (chemicals move much faster than cells divide)</text>
<rect x="50" y="100" width="150" height="80" rx="10" fill="#12946b" fill-opacity="0.14" stroke="#12946b" stroke-width="1.5"/>
<text x="125.0" y="134.0" fill="#1b1c29" font-size="17" font-weight="600" text-anchor="middle">capillaries refill</text>
<text x="125.0" y="156.0" fill="#62667f" font-size="13" text-anchor="middle">add O₂ and glucose</text>
<line x1="202" y1="140" x2="216" y2="140" stroke="#62667f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="218" y="100" width="150" height="80" rx="10" fill="#d9622b" fill-opacity="0.14" stroke="#d9622b" stroke-width="1.5"/>
<text x="293.0" y="134.0" fill="#1b1c29" font-size="17" font-weight="600" text-anchor="middle">every cell eats</text>
<text x="293.0" y="156.0" fill="#62667f" font-size="13" text-anchor="middle">its own FBA corner</text>
<line x1="370" y1="140" x2="384" y2="140" stroke="#62667f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="386" y="100" width="150" height="80" rx="10" fill="#6a4bd6" fill-opacity="0.14" stroke="#6a4bd6" stroke-width="1.5"/>
<text x="461.0" y="134.0" fill="#1b1c29" font-size="17" font-weight="600" text-anchor="middle">chemicals spread</text>
<text x="461.0" y="156.0" fill="#62667f" font-size="13" text-anchor="middle">the kernel</text>
<path d="M 470 182 C 470 215, 125 215, 125 186" fill="none" stroke="#62667f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="552" y1="140" x2="598" y2="140" stroke="#62667f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="610" y="66" fill="#1b1c29" font-size="16" font-weight="600">then every cell, at once:</text>
<text x="610" y="108" fill="#d23a5c" font-size="17" font-weight="600">dies</text>
<text x="690" y="108" fill="#62667f" font-size="13">ATP &lt; 5, or too much acid</text>
<text x="610" y="160" fill="#12946b" font-size="17" font-weight="600">divides</text>
<text x="690" y="160" fill="#62667f" font-size="13">ATP ≥ 20, if a square is free</text>
<text x="610" y="212" fill="#62667f" font-size="17" font-weight="600">stays</text>
<text x="690" y="212" fill="#62667f" font-size="13">otherwise</text>
<text x="30" y="282" fill="#1b1c29" font-size="15">Deaths happen first, freeing squares. If a tumor cell and a healthy cell both want the same</text>
<text x="30" y="304" fill="#1b1c29" font-size="15">empty square, the tumor wins 3 times out of 4 (cancer ignores the signals that tell cells to stop).</text>
<text x="30" y="342" fill="#62667f" font-size="14">Everyone decides at the same moment, like the cooperators and defectors in my spatial games project.</text>
</svg>