<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" font-family="Inter, system-ui, sans-serif">
<title>The null space of the cell's matrix is two pathways</title><desc>The 5 by 6 matrix S for glucose, pyruvate, NAD+, NADH and lactate across six reactions has rank 4, so its null space is two-dimensional. Its whole-number basis is respire = (1, 1, 2, 0, 2, 0) and ferment = (1, 1, 0, 2, 0, 2).</desc>
<rect width="900" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="30" y="40" fill="#1b1c29" font-size="20" font-weight="600">The matrix S</text>
<text x="150" y="80" fill="#62667f" font-size="13" text-anchor="middle">in</text>
<text x="202" y="80" fill="#62667f" font-size="13" text-anchor="middle">glyc</text>
<text x="254" y="80" fill="#62667f" font-size="13" text-anchor="middle">e⁻</text>
<text x="306" y="80" fill="#62667f" font-size="13" text-anchor="middle">ferm</text>
<text x="358" y="80" fill="#62667f" font-size="13" text-anchor="middle">mito</text>
<text x="410" y="80" fill="#62667f" font-size="13" text-anchor="middle">out</text>
<text x="100" y="112" fill="#1b1c29" font-size="15" text-anchor="end">glucose</text>
<text x="150" y="112" fill="#1b1c29" font-size="16" text-anchor="middle">+1</text>
<text x="202" y="112" fill="#1b1c29" font-size="16" text-anchor="middle">−1</text>
<text x="254" y="112" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="306" y="112" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="358" y="112" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="410" y="112" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="100" y="146" fill="#1b1c29" font-size="15" text-anchor="end">pyruvate</text>
<text x="150" y="146" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="202" y="146" fill="#1b1c29" font-size="16" text-anchor="middle">+2</text>
<text x="254" y="146" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="306" y="146" fill="#1b1c29" font-size="16" text-anchor="middle">−1</text>
<text x="358" y="146" fill="#1b1c29" font-size="16" text-anchor="middle">−1</text>
<text x="410" y="146" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="100" y="180" fill="#1b1c29" font-size="15" text-anchor="end">NAD⁺</text>
<text x="150" y="180" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="202" y="180" fill="#1b1c29" font-size="16" text-anchor="middle">−2</text>
<text x="254" y="180" fill="#1b1c29" font-size="16" text-anchor="middle">+1</text>
<text x="306" y="180" fill="#1b1c29" font-size="16" text-anchor="middle">+1</text>
<text x="358" y="180" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="410" y="180" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="100" y="214" fill="#1b1c29" font-size="15" text-anchor="end">NADH</text>
<text x="150" y="214" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="202" y="214" fill="#1b1c29" font-size="16" text-anchor="middle">+2</text>
<text x="254" y="214" fill="#1b1c29" font-size="16" text-anchor="middle">−1</text>
<text x="306" y="214" fill="#1b1c29" font-size="16" text-anchor="middle">−1</text>
<text x="358" y="214" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="410" y="214" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="100" y="248" fill="#1b1c29" font-size="15" text-anchor="end">lactate</text>
<text x="150" y="248" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="202" y="248" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="254" y="248" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="306" y="248" fill="#1b1c29" font-size="16" text-anchor="middle">+1</text>
<text x="358" y="248" fill="#e3e1ea" font-size="16" text-anchor="middle">0</text>
<text x="410" y="248" fill="#1b1c29" font-size="16" text-anchor="middle">−1</text>
<text x="30" y="300" fill="#62667f" font-size="12">in = glucose enters, glyc = glycolysis, e⁻ = electron transport (O₂),</text>
<text x="30" y="318" fill="#62667f" font-size="12">ferm = fermentation, mito = pyruvate burned, out = lactate leaves</text>
<text x="30" y="360" fill="#1b1c29" font-size="15">Row reduction: rank 4.</text>
<text x="30" y="384" fill="#1b1c29" font-size="15">Null space dimension = 6 − 4 = 2.</text>
<text x="30" y="408" fill="#62667f" font-size="14">(The NAD⁺ row is minus the NADH row.)</text>
<line x1="470" y1="190" x2="520" y2="190" stroke="#62667f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="540" y="40" fill="#1b1c29" font-size="20" font-weight="600">Its null space</text>
<text x="540" y="64" fill="#62667f" font-size="14">row reduction gives halves; × 2 makes them whole:</text>
<text x="555" y="88" fill="#62667f" font-size="12" text-anchor="middle">in</text>
<text x="599" y="88" fill="#62667f" font-size="12" text-anchor="middle">glyc</text>
<text x="643" y="88" fill="#62667f" font-size="12" text-anchor="middle">e⁻</text>
<text x="687" y="88" fill="#62667f" font-size="12" text-anchor="middle">ferm</text>
<text x="731" y="88" fill="#62667f" font-size="12" text-anchor="middle">mito</text>
<text x="775" y="88" fill="#62667f" font-size="12" text-anchor="middle">out</text>
<text x="818" y="158" fill="#6a4bd6" font-size="18" font-weight="600">respire</text>
<rect x="540" y="144" width="30" height="18" rx="3" fill="#6a4bd6" opacity="1"/>
<text x="555" y="180" fill="#1b1c29" font-size="14" text-anchor="middle">1</text>
<rect x="584" y="144" width="30" height="18" rx="3" fill="#6a4bd6" opacity="1"/>
<text x="599" y="180" fill="#1b1c29" font-size="14" text-anchor="middle">1</text>
<rect x="628" y="126" width="30" height="36" rx="3" fill="#6a4bd6" opacity="1"/>
<text x="643" y="180" fill="#1b1c29" font-size="14" text-anchor="middle">2</text>
<rect x="672" y="162" width="30" height="0" rx="3" fill="#6a4bd6" opacity="0"/>
<text x="687" y="180" fill="#1b1c29" font-size="14" text-anchor="middle">0</text>
<rect x="716" y="126" width="30" height="36" rx="3" fill="#6a4bd6" opacity="1"/>
<text x="731" y="180" fill="#1b1c29" font-size="14" text-anchor="middle">2</text>
<rect x="760" y="162" width="30" height="0" rx="3" fill="#6a4bd6" opacity="0"/>
<text x="775" y="180" fill="#1b1c29" font-size="14" text-anchor="middle">0</text>
<text x="540" y="202" fill="#62667f" font-size="13">32 ATP, no lactate, uses 6 O₂</text>
<text x="818" y="278" fill="#d9622b" font-size="18" font-weight="600">ferment</text>
<rect x="540" y="264" width="30" height="18" rx="3" fill="#d9622b" opacity="1"/>
<text x="555" y="300" fill="#1b1c29" font-size="14" text-anchor="middle">1</text>
<rect x="584" y="264" width="30" height="18" rx="3" fill="#d9622b" opacity="1"/>
<text x="599" y="300" fill="#1b1c29" font-size="14" text-anchor="middle">1</text>
<rect x="628" y="282" width="30" height="0" rx="3" fill="#d9622b" opacity="0"/>
<text x="643" y="300" fill="#1b1c29" font-size="14" text-anchor="middle">0</text>
<rect x="672" y="246" width="30" height="36" rx="3" fill="#d9622b" opacity="1"/>
<text x="687" y="300" fill="#1b1c29" font-size="14" text-anchor="middle">2</text>
<rect x="716" y="282" width="30" height="0" rx="3" fill="#d9622b" opacity="0"/>
<text x="731" y="300" fill="#1b1c29" font-size="14" text-anchor="middle">0</text>
<rect x="760" y="246" width="30" height="36" rx="3" fill="#d9622b" opacity="1"/>
<text x="775" y="300" fill="#1b1c29" font-size="14" text-anchor="middle">2</text>
<text x="540" y="322" fill="#62667f" font-size="13">2 ATP, 2 lactate, no O₂</text>
<text x="540" y="372" fill="#1b1c29" font-size="15">Every steady state of this cell is</text>
<text x="540" y="398" fill="#1b1c29" font-size="18">a · <tspan fill="#d9622b">ferment</tspan> + b · <tspan fill="#6a4bd6">respire</tspan></text>
<text x="540" y="422" fill="#62667f" font-size="14">a = glucose fermented, b = glucose respired</text>
<text x="30" y="478" fill="#62667f" font-size="14">The math found the two pathways from Biology class on its own: nobody told it about fermentation or respiration.</text>
</svg>